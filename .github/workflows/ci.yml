name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betcoins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: betcoins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Database migration and trading smoke test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611120001_init.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611120002_sprints.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611140001_sprint_delta.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611140002_position_cost_basis.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150001_wallet_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150002_spectator_rankings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150003_partial_resale.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150004_position_settlement_pnl.sql
          psql -v ON_ERROR_STOP=1 -f tests/db/smoke.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150005_competition_validation.sql
          psql -v ON_ERROR_STOP=1 -f tests/db/competition.sql
      - name: Clean-install baseline and economic parity smoke test
        run: |
          createdb betcoins_baseline
          # Roles are cluster-wide and were created in the first test database.
          sed '/^create role anon /d; /^create role authenticated /d' tests/db/bootstrap.sql | PGDATABASE=betcoins_baseline psql -v ON_ERROR_STOP=1
          PGDATABASE=betcoins_baseline psql -v ON_ERROR_STOP=1 -f supabase/baselines/20261115_full_install.sql
          PGDATABASE=betcoins_baseline psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150004_position_settlement_pnl.sql
          PGDATABASE=betcoins_baseline psql -v ON_ERROR_STOP=1 -f tests/db/smoke.sql
          PGDATABASE=betcoins_baseline psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150005_competition_validation.sql
          PGDATABASE=betcoins_baseline psql -v ON_ERROR_STOP=1 -f tests/db/competition.sql
      - name: Existing database upgrade 03 through 08 in one transaction
        run: |
          createdb betcoins_upgrade
          sed '/^create role anon /d; /^create role authenticated /d' tests/db/bootstrap.sql | PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1
          PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611120001_init.sql
          PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611120002_sprints.sql
          PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1 -f supabase/deploy/20261115_manual_upgrade_03_to_08.sql
          PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1 -f tests/db/smoke.sql
          PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150005_competition_validation.sql
          PGDATABASE=betcoins_upgrade psql -v ON_ERROR_STOP=1 -f tests/db/competition.sql
      - name: Concurrent admissions, captures, validation and cutoff timestamps
        run: python3 tests/db/competition_concurrency.py
      - name: Validated P2P settlement on all installation paths
        run: |
          for db in betcoins betcoins_baseline betcoins_upgrade; do
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611160001_validated_market_settlement.sql
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f tests/db/markets.sql
          done
      - name: Concurrent matching, spending, resale, settlement and cutoff
        run: python3 tests/db/markets_concurrency.py
      - name: Explicit snapshot modes on all installation paths and legacy regression
        run: |
          for db in betcoins betcoins_baseline betcoins_upgrade; do
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611160002_snapshot_market_modes.sql
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f tests/db/markets.sql
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f tests/db/market_modes.sql
          done
      - name: Concurrent mode validation, settlement and blocked financial ties
        run: python3 tests/db/market_modes_concurrency.py
      - name: Recurring calendar and generation on all installation paths
        run: |
          for db in betcoins betcoins_baseline betcoins_upgrade; do
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611160003_recurring_bets.sql
            PGDATABASE=$db psql -v ON_ERROR_STOP=1 -f tests/db/recurring_bets.sql
          done
      - name: Concurrent recurring generation, admissions and trading
        run: python3 tests/db/recurring_bets_concurrency.py
